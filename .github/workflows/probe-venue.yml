name: Probe venue page

# Temporary investigation aid: loads a page in the runner's Chrome and uploads
# what it fetched. Removed once the TIFF and Hot Docs extractors are written.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to load"
        required: true
      wait:
        description: "Milliseconds to wait after load"
        default: "20000"
      clicks:
        description: "Selectors to click after load, separated by |"
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p /tmp/probe && cd /tmp/probe && npm init -y >/dev/null && npm i playwright-core@1.56 --no-audit --no-fund
      - env:
          URL: ${{ inputs.url }}
          WAIT: ${{ inputs.wait }}
          CLICKS: ${{ inputs.clicks }}
          NODE_PATH: /tmp/probe/node_modules
        run: cp .github/probe/watch.mjs /tmp/probe/ && cd /tmp/probe && node watch.mjs "$URL" "$GITHUB_WORKSPACE/probe-out" "$WAIT" "$CLICKS"
      - name: Print summary
        run: |
          cd probe-out && ls -la && head -c 4000 log.json; echo
          for f in *.txt; do echo "===== $f"; head -c 1500 "$f"; echo; done
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: probe-out
