name: Deploy site to GitHub Pages

# Builds the static export from the database and publishes it. Called after each
# ingest and on pushes that touch the site; it can also be run by hand.
on:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: false
  workflow_dispatch:
    inputs:
      demo:
        description: "Publish the sample listings even though no database is configured"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - name: Refuse to publish sample data by accident
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_DEMO: ${{ inputs.demo }}
        run: |
          if [ -z "$DATABASE_URL" ] && [ "$ALLOW_DEMO" != "true" ]; then
            echo "::error::The DATABASE_URL secret is not set, so this build would publish the sample listings. Add the secret, or run this workflow by hand with the demo option."
            exit 1
          fi
      - run: npm ci
      - name: Keep poster copies between builds
        # The build fetches only posters this folder lacks and prunes the rest.
        uses: actions/cache@v4
        with:
          path: apps/web/public/posters
          key: posters-${{ github.run_id }}
          restore-keys: posters-
      - name: Build static site
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build --workspace=@vic/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
